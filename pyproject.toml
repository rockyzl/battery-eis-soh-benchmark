[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-eis-soh-benchmark"
version = "0.1.0"
description = "Leakage-resistant clean-room benchmark for battery SoH estimation from EIS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
battery-eis-soh = "battery_eis_soh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_eis_soh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
